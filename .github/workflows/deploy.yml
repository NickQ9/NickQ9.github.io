# main に push すると GitHub Pages へ自動デプロイします。
# 事前に リポジトリの Settings → Pages → Source を「GitHub Actions」にしてください。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json をコミットしたら「npm ci」に変更すると、ビルドが速く安定します。
      - run: npm install --no-audit --no-fund
      # リポジトリ名が「NickQ9.github.io」なら BASE_URL は「/」のままでOK。
      # それ以外（例: portfolio）の場合は「/portfolio/」に変更してください。
      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
